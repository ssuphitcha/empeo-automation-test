<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>TC-71858 · หน้า /{locale}/halving — รวมผลเทส UI</title>
<style>
  :root {
    --green: #2e844a; --green-bg: #e3f6e8; --red: #c5292e; --red-bg: #fbe9e9;
    --border: #e1e4e8; --sidebar-bg: #fafbfc; --code-bg: #f6f8fa; --text: #24292e;
    --muted: #6a737d; --accent: #0969da; --selected-bg: #eef8f0; --selected-bg-fail: #fdecec;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--text); background:#fff; font-size:14px; }
  .app { display:flex; height:100vh; }
  .topbar { position:fixed; top:0; left:0; right:0; height:56px; background:#fff; border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 20px; gap:16px; z-index:10; }
  .topbar .title { font-weight:700; font-size:15px; white-space:nowrap; }
  .topbar .sub { color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .stat-pill { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:999px; font-weight:600; font-size:13px; }
  .stat-pill.pass { background:var(--green-bg); color:var(--green); }
  .stat-pill.fail { background:var(--red-bg); color:var(--red); }
  .topbar .spacer { flex:1; }
  .sidebar { width:340px; flex-shrink:0; border-right:1px solid var(--border); background:var(--sidebar-bg); margin-top:56px; height:calc(100vh - 56px); overflow-y:auto; overflow-x:hidden; position:relative; }
  .resize-handle { width:6px; flex-shrink:0; margin-top:56px; height:calc(100vh - 56px); cursor:col-resize; background:transparent; position:relative; z-index:5; }
  .resize-handle:hover, .resize-handle.dragging { background:var(--accent); opacity:.25; }
  .test-item .name { white-space:normal; overflow-wrap:break-word; }
  .filter-box { padding:10px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--sidebar-bg); z-index:2; }
  .filter-box input { width:100%; padding:7px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; outline:none; }
  .filter-box input:focus { border-color:var(--accent); }
  .group-header { padding:10px 14px 6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; align-items:center; justify-content:space-between; }
  .group-header .count { font-weight:500; color:var(--muted); }
  .test-item { display:flex; align-items:center; gap:8px; padding:7px 14px 7px 22px; cursor:pointer; border-left:3px solid transparent; font-size:12.8px; }
  .test-item:hover { background:#f1f3f4; }
  .test-item.selected { background:var(--selected-bg); border-left-color:var(--green); }
  .test-item.selected.fail { background:var(--selected-bg-fail); border-left-color:var(--red); }
  .test-item .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--green); }
  .test-item .dot.fail { background:var(--red); }
  .test-item .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .test-item .id { color:var(--muted); font-size:11px; display:block; }
  .main { flex:1; margin-top:56px; height:calc(100vh - 56px); overflow-y:auto; padding:28px 40px 80px; }
  .panel-header { margin-bottom:18px; }
  .panel-header .id { color:var(--accent); font-weight:700; font-size:13px; }
  .panel-header h1 { font-size:20px; margin:4px 0 6px; }
  .tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .tag { font-size:11px; padding:2px 9px; border-radius:4px; font-weight:600; background:var(--code-bg); color:var(--muted); border:1px solid var(--border); }
  .tag.status-pass { background:var(--green-bg); color:var(--green); border-color:transparent; }
  .tag.status-fail { background:var(--red-bg); color:var(--red); border-color:transparent; }
  .tag.status-blocked { background:#fff4e0; color:#8a5a00; border-color:transparent; }
  .stat-pill.blocked { background:#fff4e0; color:#8a5a00; }
  .stat-pill.skip { background:#eef1f4; color:#57606a; }
  .tag.status-skip { background:#eef1f4; color:#57606a; border-color:transparent; }
  .dot.skip { background:#9aa5b1; }
  .test-item.selected.skip { background:#f4f6f8; border-left-color:#9aa5b1; }
  .result-box.skip { background:#f4f6f8; border:1px solid #dbe1e6; color:#48515a; }
  .result-box.skip .check { background:#9aa5b1; }
  .summary-card.skip .num { color:#57606a; }
  .dot.blocked { background:#d99000; }
  .test-item.selected.blocked { background:#fff8ec; border-left-color:#d99000; }
  .result-box.blocked { background:#fff8ec; border:1px solid #f0d9a8; color:#7a5300; }
  .result-box.blocked .check { background:#d99000; }
  .summary-card.blocked .num { color:#8a5a00; }
  .block { margin-top:20px; }
  .block-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; }
  .box { background:var(--code-bg); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:6px; padding:10px 14px; font-size:13px; white-space:pre-wrap; }
  ol.steps { margin:0; padding-left:20px; }
  ol.steps li { margin-bottom:6px; font-size:13.5px; }
  table.steps-table { border-collapse:collapse; width:100%; font-size:13px; }
  table.steps-table th, table.steps-table td { border:1px solid var(--border); padding:8px 12px; text-align:left; vertical-align:top; }
  table.steps-table th { background:var(--code-bg); font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  table.steps-table td.num { text-align:center; font-weight:700; color:var(--muted); width:32px; }
  table.steps-table td.expected { background:#fbfdfc; }
  /* Stacked top-to-bottom, one per row: these are full-page captures, and side-by-side
     thumbnails shrink them to the point the ringed number is unreadable. */
  .img-gallery { display:flex; flex-direction:column; gap:22px; margin-top:10px; }
  .shot { border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#fff; }
  .shot-head { padding:8px 12px; background:var(--code-bg); border-bottom:1px solid var(--border);
                font-size:12.5px; font-weight:700; color:var(--text); display:flex; gap:8px;
                align-items:baseline; }
  .shot-head .n { display:inline-flex; width:18px; height:18px; border-radius:50%;
                   background:var(--muted); color:#fff; font-size:11px; align-items:center;
                   justify-content:center; flex-shrink:0; }
  .shot-head .fn { font-weight:400; color:var(--muted); font-family:"SF Mono",Menlo,monospace;
                    font-size:11.5px; margin-left:auto; }
  .shot img { display:block; width:100%; cursor:zoom-in; }
  /* Never upscale past the recorded resolution -- a stretched video reads as blurry
     evidence. width:100% alone let an 800x500 capture render at 1092px (1.36x). */
  .shot video { display:block; width:100%; max-width:100%; background:#000; }
  /* ไม่ให้ข้อความยาวดันกรอบจนล้น */
  .checks { min-width:0; }
  .checks .cv { overflow-wrap:anywhere; word-break:break-word; min-width:0; }
  .box, .result-box { overflow-wrap:anywhere; }
  /* จำกัดความสูงรูป — ภาพมือถือและภาพเต็มหน้าจะไม่ยาวจนดูยาก */
  /* เพดานเป็นพิกเซลคู่กับ vh — ถ้าใช้ vh เดี่ยว ๆ บนจอสูงรูปจะไม่ถูกย่อเลย
     ภาพมือถือสูง 844px จะยาวเกินจอและดูเหมือนถูกตัด */
  .shot img { max-width:100%; max-height:min(58vh, 430px); width:auto; height:auto;
               object-fit:contain; display:block; margin:0 auto; cursor:zoom-in; }
  .shot.tall img { max-height:min(64vh, 480px); }
  .shot-head .zoom { margin-left:auto; color:var(--accent); font-weight:600; font-size:11.5px; }
  /* ลำดับหลักฐาน */
  .tl { display:flex; flex-direction:column; gap:0; }
  .tl-row { display:grid; grid-template-columns:26px minmax(0,1fr); gap:10px; padding:0 0 14px 0; position:relative; }
  .tl-row > * { min-width:0; }
  .tl { min-width:0; }
  .block { min-width:0; overflow:hidden; }
  .tl-row:not(:last-child)::before { content:''; position:absolute; left:12px; top:26px; bottom:0;
      width:2px; background:var(--border); }
  /* เลขลำดับใช้แค่ 2 สี — เขียวคือสเตปที่ผ่าน แดงคือสเตปที่บั๊ก */
  .tl-dot { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:700; color:#fff; background:var(--green); z-index:1; }
  .tl-dot.ng { background:var(--red); }
  .tl-row.ng .tl-kind { color:var(--red); }
  .tl-row.ng .tl-why { color:#7a1f23; }
  table.steps, table { table-layout:fixed; width:100%; }
  table td { overflow-wrap:anywhere; }
  /* แถบภาพเพิ่มเติม พับเก็บได้ */
  .extras { border:1px solid var(--border); border-radius:8px; background:var(--sidebar-bg);
      margin:4px 0 0; overflow:hidden; }
  .extras > summary { cursor:pointer; padding:11px 14px; font-size:13px; font-weight:600;
      list-style:none; display:flex; align-items:center; gap:9px; user-select:none; }
  .extras > summary::-webkit-details-marker { display:none; }
  .extras > summary::before { content:'▸'; color:var(--muted); font-size:12px;
      transition:transform .15s ease; display:inline-block; }
  .extras[open] > summary::before { transform:rotate(90deg); }
  .extras > summary:hover { background:#f0f3f6; }
  .extras .extras-tag { font-weight:400; color:var(--muted); font-size:12.5px; }
  .extras-body { padding:0 14px 14px; display:flex; flex-direction:column; gap:12px; }
  .extras-foot { padding:0 14px 12px; }
  .extras-foot button { font:600 12px/1 -apple-system,sans-serif; color:var(--accent);
      background:none; border:1px solid var(--border); border-radius:6px; padding:7px 12px; cursor:pointer; }
  .extras-foot button:hover { background:#eef4fb; }
  /* Scope / Tested via เขียนเป็นหลายบรรทัด ต้องคงบรรทัดและย่อหน้าไว้ */
  .meta-list { line-height:1.7; }
  .meta-list > div { white-space:pre-wrap; margin-bottom:10px; }
  .meta-list > div:last-child { margin-bottom:0; }
  .ac { background:#f2f7fd; border:1px solid #cfe2f7; border-radius:8px; padding:11px 15px; font-size:13.5px; }
  .ac ul { margin:0; padding-left:18px; }
  .ac li { margin:1px 0; }
  .ac .ac-id { font-weight:700; color:#0a4d8c; }
  .ac .ac-why { color:var(--muted); font-size:12.5px; margin-top:6px; }
  .ac.none { background:var(--code-bg); border-color:var(--border); color:var(--muted); }
  .tl-why { font-size:13px; color:var(--text); margin:2px 0 6px; }
  .tl-kind { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .tl-cmd { font-family:"SF Mono",Menlo,monospace; font-size:12px; background:#1f2430; color:#e6edf3;
      padding:9px 12px; border-radius:6px; overflow-x:auto; white-space:pre; margin:0 0 6px;
      line-height:1.55; max-height:320px; overflow-y:auto; }
  /* JSON viewer: เลขบรรทัด + สี */
  .jsonview { display:flex; background:#fff; border:1px solid var(--border); border-radius:6px;
    overflow:hidden; margin:0 0 6px; font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:12px; line-height:1.55; max-height:340px; }
  .jsonview .gutter { flex:0 0 auto; text-align:right; padding:10px 8px 10px 12px; margin:0;
    background:#f6f8fa; border-right:1px solid var(--border); color:#8c959f;
    user-select:none; white-space:pre; overflow:hidden; }
  .jsonview .jcode { flex:1 1 auto; min-width:0; padding:10px 14px; margin:0;
    overflow:auto; white-space:pre; color:#24292f; }
  .jsonview .jkey { color:#a11f36; }
  .jsonview .jstr { color:#1f4e9c; }
  .jsonview .jnum { color:#0f6f6f; }
  .jsonview .jbool, .jsonview .jnull { color:#8250df; }
  .jsonview .jpunc { color:#6e7781; }
  .tl-out { font-family:"SF Mono",Menlo,monospace; font-size:12px; background:var(--code-bg);
      border:1px solid var(--border); border-radius:6px; padding:8px 11px; margin:0;
      white-space:pre-wrap; overflow-wrap:anywhere; max-height:260px; overflow-y:auto; }
  .shot video.native { max-width:100%; margin:0 auto; }
  .checks { display:grid; grid-template-columns:auto auto 1fr; gap:4px 10px; margin-top:2px; }
  .checks .ck { font-weight:700; }
  .checks .ck.ok { color:var(--green); }
  .checks .ck.no { color:var(--red); }
  .checks .ck.none { color:var(--muted); }
  .checks .cl { color:var(--muted); }
  .checks .cv { font-family:"SF Mono",Menlo,monospace; font-size:12.5px; }
  .result-box { margin-top:18px; padding:12px 16px; border-radius:6px; background:var(--green-bg); border:1px solid #c3e6cb; color:#1b5e2e; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; }
  .result-box.fail { background:var(--red-bg); border:1px solid #f5c2c7; color:#7a1f23; }
  .result-box .check { width:18px; height:18px; border-radius:50%; background:var(--green); color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; }
  .result-box.fail .check { background:var(--red); }
  .test-item.home { border-bottom:1px solid var(--border); }
  .test-item.home .name { font-weight:700; }
  .dot.home { background:var(--muted); }
  .summary-view h1 { font-size:22px; margin-bottom:4px; }
  .summary-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:20px; }
  .summary-card { border:1px solid var(--border); border-radius:8px; padding:16px 18px; }
  .summary-card .num { font-size:26px; font-weight:700; }
  .summary-card .label { font-size:12.5px; color:var(--muted); margin-top:2px; }
  .summary-card.pass .num { color:var(--green); }
  .summary-card.fail .num { color:var(--red); }
  table.summary { border-collapse:collapse; width:100%; margin-top:26px; font-size:13.5px; }
  table.summary th, table.summary td { border:1px solid var(--border); padding:8px 12px; text-align:left; }
  table.summary th { background:var(--code-bg); }
  table.summary td.num, table.summary th.num { text-align:center; }
  .meta-list { margin-top:18px; color:var(--muted); font-size:13px; line-height:1.8; }
  .meta-list b { color:var(--text); }
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; align-items:center; justify-content:center; }
  .lightbox img { max-width:92vw; max-height:92vh; }
  .checks { min-width:0; }
  .checks .cv { overflow-wrap:anywhere; word-break:break-word; }
  .box { overflow-wrap:anywhere; }

  /* API card — the shape TC-74166 uses, rendered instead of screenshotted */
  .apic { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:6px 0 0; }
  .apic-head { display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--sidebar-bg);
               border-bottom:1px solid var(--border); font-size:13px; }
  .apic-verb { font-weight:700; font-size:11px; letter-spacing:.04em; color:#fff; padding:3px 9px; border-radius:4px; }
  .apic-verb.GET{background:#2e844a} .apic-verb.POST{background:#b8860b}
  .apic-verb.PATCH{background:#8250df} .apic-verb.DELETE{background:var(--red)} .apic-verb.PUT{background:#0969da}
  .apic-url { font-family:"SF Mono",Menlo,monospace; font-size:12.5px; word-break:break-all; }
  .apic-auth { padding:7px 12px; border-bottom:1px solid var(--border); font-size:12.5px; color:var(--muted); }
  .apic-auth b { color:var(--text); font-weight:600; }
  .apic-meta { padding:7px 12px; border-bottom:1px solid var(--border); font-size:12.5px; display:flex; gap:18px; }
  .apic-meta .ok { color:var(--green); font-weight:700; }
  .apic-meta .bad { color:var(--red); font-weight:700; }
  .apic-sec { padding:12px 14px 0; font-size:11px; font-weight:700; letter-spacing:.05em;
              text-transform:uppercase; color:var(--muted); }
  /* inside a card the JSON sits straight on the card, like the reference
     report: no nested box, no rounded corners, no line-number gutter */
  .apic .jsonview { margin:0; border:0; border-radius:0; background:transparent;
                    max-height:420px; line-height:1.7; }
  .apic .jsonview .gutter { display:none; }
  .apic .jsonview .jcode { padding:4px 18px 18px; }
  .apic .tl-out { margin:0; border:0; border-radius:0; background:transparent;
                  padding:4px 18px 18px; line-height:1.7; }
  .apic-head { padding:11px 14px; }
  .apic-auth, .apic-meta { padding:9px 14px; }
  /* database block */
  .dbc { border:1px solid var(--border); border-radius:8px; overflow:hidden; margin:6px 0 0; }
  .dbc-head { padding:9px 12px; background:var(--sidebar-bg); border-bottom:1px solid var(--border);
              font-size:13px; font-weight:600; }
  .dbc-head span { color:var(--muted); font-weight:400; }
  .dbc-body { padding:10px 12px; }
  .dbc-q { font-family:"SF Mono",Menlo,monospace; font-size:12px; background:var(--code-bg);
           border:1px solid var(--border); border-radius:6px; padding:7px 10px; display:inline-block; margin-bottom:8px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="title" id="topbarTitle"></div>
  <div class="sub" id="topbarSub"></div>
  <div class="spacer"></div>
  <span class="stat-pill pass" id="pillPass"></span>
  <span class="stat-pill fail" id="pillFail"></span>
  <span class="stat-pill blocked" id="pillBlocked"></span>
  <span class="stat-pill skip" id="pillSkip"></span>
  <div class="sub" id="topbarDate"></div>
</div>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="filter-box"><input id="filterInput" type="text" placeholder="Filter tests..." oninput="filterTests()"></div>
    <div id="sidebarList"></div>
  </div>
  <div class="resize-handle" id="resizeHandle" title="Drag to resize"></div>
  <div class="main" id="mainPanel"></div>
</div>
<div class="lightbox" id="lightbox" onclick="this.style.display='none'"><img id="lightboxImg"></div>
<script>
